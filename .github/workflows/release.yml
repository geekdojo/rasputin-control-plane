name: release

# Publishes the statically-linked control-plane binaries that the OS-image
# pipeline (rasputin-os) vendors. See os-images/buildroot-os.md §5.
#
# Binaries are pure-Go (CGO_ENABLED=0), so one build per GOARCH yields a
# libc-independent static ELF that runs on the Buildroot OS *and* OpenWrt.
#
# Triggers:
#   - push of a v* tag (e.g. v2026.07.1 or v2026.07.1-dev.1) → publish a Release
#   - manual dispatch (publish=false) → bench dry-run, artifacts only
#   - manual dispatch (publish=true)  → publish a dev release versioned
#       ${vars.RASPUTIN_VERSION}-dev.<run> (dev.N = run number). The release base
#       (YYYY.MM.MICRO CalVer) comes from the org var RASPUTIN_VERSION, shared
#       with rasputin-os / -openwrt-firewall for lockstep. Versions are CalVer
#       now (was semver) — CalVer's year >> the old 0.x major, so an OS still
#       reporting an old semver agent sees CalVer as a clean upgrade.

env:
  # GOTOOLCHAIN: the go command fetches this toolchain itself, from the module
  # proxy, instead of using whatever actions/setup-go could resolve. That matters
  # because setup-go resolves against GitHub's actions/go-versions manifest, which
  # LAGS go.dev — on 2026-08-13 go1.26.6 was published and fixed five reachable
  # net/http + encoding/asn1 advisories, but the manifest still topped out at
  # 1.26.5, so neither `go-version: "1.26"` nor check-latest could obtain the fix
  # and vuln-scan was red on code that had passed hours earlier.
  #
  # Bumping this one line is the whole remediation for a stdlib advisory, and it
  # WORKS the day the fix ships rather than whenever GitHub catches up. Kept as an
  # exact version deliberately: `latest` would also jump minor releases and break
  # the build on Go's schedule rather than ours.
  GOTOOLCHAIN: go1.26.6

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a dev release (versioned from org var RASPUTIN_VERSION). Off = bench dry-run, artifacts only."
        type: boolean
        default: false

permissions:
  contents: write   # create the release + upload assets

jobs:
  # The shipping gate. No control-plane release carrying a real or unreviewed
  # critical/high CodeQL finding is ever cut — and because rasputin-os and
  # rasputin-openwrt-firewall build their images from a PUBLISHED release
  # pinned by version and hash rather than from this source, blocking the
  # release here is the single boundary that keeps such code out of every image
  # built from this point on. There is deliberately no equivalent gate in those
  # repos: they have no control-plane source to analyse.
  #
  # Called rather than copied so the release gate and the PR gate cannot drift.
  # Runs on dry-run dispatches too — a dry run that skipped the gate would
  # report a green build that a real release would then refuse to cut.
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The exact commit this job checked out and builds. The release tag must
      # land HERE, not on whatever the default branch points at when the
      # publish step runs minutes later: with no explicit target, GitHub creates
      # a new tag from the default branch at publish time, so a PR merged
      # mid-run tags a commit the binaries were never built from
      # (v2026.09.4-dev.164: built from 08ed3f7, tagged dd860d0 after #320
      # merged). Read from the checkout rather than GITHUB_SHA so it is, by
      # construction, the tree build-release.sh compiles.
      - name: Record built commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          # check-latest: fetch the newest 1.26.x rather than reusing whatever
          # patch the runner image happens to have cached. On 2026-08-13 the
          # runner served a cached go1.26.5 while go1.26.6 — which fixes five
          # reachable net/http + encoding/asn1 advisories — was already
          # published, so vuln-scan went red on a commit whose identical code
          # had passed an hour earlier and no re-run could clear it.
          go-version: "1.26"
          check-latest: true
          # cache keyed on the workspace go.sum files
          # Glob, not a literal list: every go.work module's go.sum keys the
          # cache, so adding a module cannot silently leave it out.
          cache-dependency-path: "*/go.sum"

      # Node for the web UI build (build-release.sh runs npm ci + next
      # build and packs ui/out into the api tarballs). Version pin
      # rationale lives in ci.yml's frontend job.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Resolve version
        id: ver
        # TARGET_VERSION = org var RASPUTIN_VERSION (current dev target, CalVer
        # YYYY.MM.MICRO), shared across the three Rasputin repos for lockstep.
        env:
          TARGET_VERSION: ${{ vars.RASPUTIN_VERSION }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            if [ -z "${TARGET_VERSION}" ]; then
              echo "::error::org var RASPUTIN_VERSION is unset — set it to the current dev target (e.g. 2026.07.1): gh variable set RASPUTIN_VERSION --org geekdojo --body 2026.07.1 --visibility all"
              exit 1
            fi
            V="${TARGET_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Release tag is always v<version> (the OS .mk downloads from
          # .../releases/download/v<version>/...). On a tag push this equals the
          # pushed ref; on a dispatch-publish it tags the dispatched commit.
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          # A pre-release (anything with a hyphen, e.g. 2026.07.1-dev.73) maps to
          # the dev channel + GitHub prerelease; a clean CalVer is stable.
          case "$V" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"; echo "channel=dev"    >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Building version $V"

      - name: Build release artifacts
        run: ./scripts/build-release.sh "${{ steps.ver.outputs.version }}"

      # Tag push → publish a GitHub Release with the tarballs + checksums.
      # rasputin-os fetches these from
      #   .../releases/download/v<version>/rasputin-<comp>-<version>-linux-<arch>.tar.gz
      - name: Publish release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.publish == 'true')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          # --target pins a NEW tag (dispatch-publish) to the built commit. On a
          # tag push the tag already exists and GitHub ignores target_commitish,
          # so that path is unchanged — and there the checked-out commit is the
          # tagged commit anyway.
          TARGET_SHA: ${{ steps.src.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          PRERELEASE_FLAG=""
          [ "${{ steps.ver.outputs.prerelease }}" = "true" ] && PRERELEASE_FLAG="--prerelease"

          # Before publishing: a tag already on ANOTHER commit would make
          # gh ignore --target and publish these binaries under it. Refuse
          # (status 1), and refuse if the remote cannot be read (2). Status 0
          # is the tag-push path (the tag is the checked-out commit); 3 means
          # this run creates the tag.
          created_tag=false
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$TAG" "$TARGET_SHA" || rc=$?
          case "$rc" in
            0) ;;
            3) created_tag=true ;;
            *) echo "::error::refusing to publish $TAG: see release-target-guard above"; exit 1 ;;
          esac

          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Rasputin control plane $TAG" \
            --notes "Static linux binaries for the OS-image pipeline (agent + api, amd64 + arm64; the api tarball bundles the web UI), plus mesh-images.json — the pinned container images the OS image bakes for an offline first boot. Vendored by rasputin-os; verify with the published .sha256 / .hash." \
            $PRERELEASE_FLAG \
            dist/*.tar.gz dist/*.json dist/*.sha256 dist/*.hash

          # After publishing: prove the tag landed on the built commit. A tag
          # this run created on the wrong commit is deleted with its release so
          # nothing mis-tagged stays published (releases here are immutable, so
          # the dev.N name is burned; the next dispatch gets a new run number).
          # A tag that existed before this step was pushed by a person and is
          # never deleted. Only a proven mismatch (1) deletes; an unreadable
          # remote fails without touching the release.
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$TAG" "$TARGET_SHA" || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$rc" = 1 ] && [ "$created_tag" = true ]; then
              echo "::error::deleting release $TAG and its tag: this run created them on the wrong commit"
              gh release delete "$TAG" --cleanup-tag --yes \
                || echo "::error::could not delete release $TAG; delete it and its tag by hand"
            fi
            exit 1
          fi

      # Bench dispatch (publish=false) → just keep the artifacts for inspection.
      - name: Upload artifacts (dispatch dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && !(inputs.publish == true || inputs.publish == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: dist/
