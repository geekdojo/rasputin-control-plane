name: ci

# Safety net for every push and PR. Two jobs in parallel:
#
#   backend  — gofmt + go vet + go build + go test for EVERY module in
#              go.work, enumerated by scripts/workspace-modules.sh rather
#              than listed here (it said api / agent / proto long after the
#              workspace grew artifactsig and tileschema, so neither was
#              built, vetted or tested — and both ship tests that therefore
#              never ran). api's coverage is uploaded as a build artifact so
#              we can watch it trend over time. Failures gate merges via
#              branch-protection (configured outside this file).
#
#   frontend — eslint + TypeScript type-check + `npm test` (node --test) +
#              Next.js production build. Catches type regressions and
#              build-time errors (Server Components, missing 'use client',
#              stale imports) that tsc alone misses, and executes the §4.6
#              archive-key crypto rather than only compiling it.
#
# Conventions match release.yml: Go 1.26, actions/setup-go@v5 with cache
# keyed on the workspace's go.sum files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Opt into the Node.js 24 runner for JavaScript-based actions now, ahead of
# the GitHub-forced migration on 2026-06-16. Removes the deprecation
# annotation that the first run flagged.
env:
  # GOTOOLCHAIN: the go command fetches this toolchain itself, from the module
  # proxy, instead of using whatever actions/setup-go could resolve. That matters
  # because setup-go resolves against GitHub's actions/go-versions manifest, which
  # LAGS go.dev — on 2026-08-13 go1.26.6 was published and fixed five reachable
  # net/http + encoding/asn1 advisories, but the manifest still topped out at
  # 1.26.5, so neither `go-version: "1.26"` nor check-latest could obtain the fix
  # and vuln-scan was red on code that had passed hours earlier.
  #
  # Bumping this one line is the whole remediation for a stdlib advisory, and it
  # WORKS the day the fix ships rather than whenever GitHub catches up. Kept as an
  # exact version deliberately: `latest` would also jump minor releases and break
  # the build on Go's schedule rather than ours.
  GOTOOLCHAIN: go1.26.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  catalog-floor:
    # The offline floor ships in every image, so a hand-edited or stale bundle
    # would reach every cluster built from this commit. The Go test checks it
    # parses and agrees with catalog-version.txt; this checks the bytes are
    # still the ones the publisher SIGNED, which no amount of Go can tell.
    name: catalog floor signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify the embedded catalog floor
        env:
          RASPUTIN_ROOT_CA_PEM: ${{ vars.RASPUTIN_ROOT_CA_PEM }}
        run: |
          set -eu
          if [ -z "${RASPUTIN_ROOT_CA_PEM:-}" ]; then
            echo "::error::vars.RASPUTIN_ROOT_CA_PEM is unset; cannot verify the embedded catalog floor"
            exit 1
          fi
          ./scripts/embed-catalog.sh --verify

  backend:
    name: backend (vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # check-latest: fetch the newest 1.26.x rather than reusing whatever
          # patch the runner image happens to have cached. On 2026-08-13 the
          # runner served a cached go1.26.5 while go1.26.6 — which fixes five
          # reachable net/http + encoding/asn1 advisories — was already
          # published, so vuln-scan went red on a commit whose identical code
          # had passed an hour earlier and no re-run could clear it.
          go-version: "1.26"
          check-latest: true
          # Glob, not a literal list: every go.work module's go.sum keys the
          # cache, so adding a module cannot silently leave it out.
          cache-dependency-path: "*/go.sum"

      # The scan gates all derive their module list from go.work now, but
      # Dependabot reads .github/dependabot.yml directly and cannot call a
      # script, so its gomod `directories:` block is the one module list still
      # written by hand. This is the compensating check that keeps it honest —
      # without it, a sixth module would silently get no dependency updates.
      - name: dependabot covers every go.work module
        run: ./scripts/workspace-modules.sh --verify-dependabot

      # Every step below iterates the modules DERIVED from go.work
      # (scripts/workspace-modules.sh) instead of naming them.
      #
      # gofmt -l prints unformatted files; if its output is non-empty,
      # fail the job. Cheaper signal than running goimports in CI.
      - name: gofmt
        run: |
          # Resolve the list into a variable FIRST. Nesting it directly as
          # `gofmt -l $(...)` would, if the helper ever failed, leave gofmt with
          # no path arguments — at which point it reads stdin instead of
          # erroring, and the step passes having formatted nothing.
          modules="$(./scripts/workspace-modules.sh)"
          unformatted=$(gofmt -l $modules)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          for m in $modules; do
            echo "::group::go vet ./$m/..."
            go vet "./$m/..."
            echo "::endgroup::"
          done

      # Coverage profile only for api — it remains the module whose coverage we
      # trend, and that choice is deliberate rather than a list that drifts.
      # Every other module is still TESTED below; it just isn't profiled.
      - name: test (api with coverage)
        run: |
          go test -race -coverprofile=api.coverage.out -covermode=atomic ./api/...

      - name: test (remaining modules)
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          # `if ... then continue; fi`, not `[ ... ] && continue`: the latter
          # yields a non-zero status on the skip branch, which is a `set -e`
          # trap waiting for whichever module happens to sort last.
          for m in $modules; do
            if [ "$m" = "api" ]; then continue; fi
            echo "::group::go test ./$m/..."
            go test -race "./$m/..."
            echo "::endgroup::"
          done

      - name: coverage summary
        run: |
          go tool cover -func=api.coverage.out | tail -1

      - name: build
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          for m in $modules; do
            echo "::group::go build ./$m/..."
            go build "./$m/..."
            echo "::endgroup::"
          done

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: api.coverage.out
          retention-days: 30

  frontend:
    # ⚠️ This name is an API, not a label. `main`'s branch protection lists it
    # verbatim as a required status context, and a required context is matched
    # by NAME — so renaming this job here does not rename the requirement: the
    # old context simply stops reporting, and every PR sits at `blocked` with a
    # combined status of `pending` and no failing check to point at. That is
    # what happened on PR #223, where the rename was the only change and all
    # twelve checks were green.
    #
    # So the name UNDER-DESCRIBES the job on purpose (it also runs eslint and
    # `npm test` — see the steps below and the header comment). Changing it
    # requires updating the required_status_checks contexts on `main` in the
    # same change, which is a repo-settings change and Bryce's call.
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Project Node: current LTS (Node 22, LTS through April 2027).
          # Next 16 requires >=20.9.0 (its own engines field), so 22 clears it
          # comfortably — note 16 dropped Node 18, which the previous Next 15
          # note here still listed as supported. Not bumping to 24 until it
          # goes LTS in October 2026.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: install
        run: npm ci

      # eslint runs first because it is the cheapest of the three and, until
      # 2026-08-16, did not run at all: the repo carried nine eslint-disable
      # comments waiving rules for a linter that was in neither dependencies nor
      # devDependencies and that ci.yml never invoked. Those comments read as
      # nine reviewed exceptions; no linter had ever evaluated the lines.
      #
      # Errors fail. Warnings print and do not fail — the react-hooks
      # exhaustive-deps warnings are kept deliberately visible as pointers to
      # investigate if the UI misbehaves, and making them blockers would only
      # get them suppressed again.
      #
      # The release path is gated too, in scripts/build-release.sh, so a release
      # cannot be cut from code that fails this.
      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run type-check

      # ui/ had no test runner at all until 2026-09-01, which meant the §4.6
      # archive-key crypto — the part of this frontend where a silent mistake
      # costs an operator their backup — was covered by nothing. `npm test`
      # compiles lib/ and components/storage/ to CommonJS and runs them under
      # node --test; it adds no dependency to package.json, deliberately (see
      # ui/tsconfig.test.json for why that mattered here).
      - name: test
        run: npm test

      # Next build catches a class of errors tsc doesn't: missing 'use
      # client' directives, server/client component boundary violations,
      # bad dynamic imports. It also produces the static export (out/)
      # that release tarballs ship — so assert it actually materialized.
      # (NEXT_PUBLIC_API_BASE is computed inside next.config.mjs from
      # NODE_ENV; production builds bake in same-origin paths.)
      - name: build
        run: npm run build

      - name: assert static export
        run: test -f out/index.html && test -f out/login.html
