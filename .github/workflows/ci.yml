name: ci

# Safety net for every push and PR. Jobs, in parallel:
#
#   catalog-floor — the embedded catalog floor still carries the publisher's
#              signature, made by a leaf authorized to sign catalogs
#              (scripts/embed-catalog.sh --verify).
#
#   release-target-guard — tests for scripts/release-target-guard.sh, which
#              release.yml runs to prove a release tag is on the built commit.
#
#   auth-register — .github/auth-register.tsv still describes the code it
#              anchors to (scripts/auth-register.sh --gate), plus the gate's
#              own tests. python3 only.
#
#   failopen — the fail-open lint (api/cmd/failopenlint) over the whole tree,
#              its allowance register, the security-resolver register, and the
#              lint's own tests.
#
#   backend  — gofmt + go vet + go build + go test for EVERY module in
#              go.work, enumerated by scripts/workspace-modules.sh rather
#              than listed here (it said api / agent / proto long after the
#              workspace grew artifactsig and tileschema, so neither was
#              built, vetted or tested — and both ship tests that therefore
#              never ran). api's coverage is uploaded as a build artifact so
#              we can watch it trend over time. Failures gate merges via
#              branch-protection (configured outside this file).
#
#   caddy-admin-socket — the agent's Caddy supervisor against the real Caddy
#              the OS image ships, run as root: the admin API is reachable
#              only through a root-only unix socket (geekdojo-brain#450).
#
#   frontend — eslint + TypeScript type-check + `npm test` (node --test) +
#              Next.js production build. Catches type regressions and
#              build-time errors (Server Components, missing 'use client',
#              stale imports) that tsc alone misses, and executes the §4.6
#              archive-key crypto rather than only compiling it.
#
# Conventions match release.yml: Go 1.26, actions/setup-go@v5 with cache
# keyed on the workspace's go.sum files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Opt into the Node.js 24 runner for JavaScript-based actions now, ahead of
# the GitHub-forced migration on 2026-06-16. Removes the deprecation
# annotation that the first run flagged.
env:
  # GOTOOLCHAIN: the go command fetches this toolchain itself, from the module
  # proxy, instead of using whatever actions/setup-go could resolve. That matters
  # because setup-go resolves against GitHub's actions/go-versions manifest, which
  # LAGS go.dev — on 2026-08-13 go1.26.6 was published and fixed five reachable
  # net/http + encoding/asn1 advisories, but the manifest still topped out at
  # 1.26.5, so neither `go-version: "1.26"` nor check-latest could obtain the fix
  # and vuln-scan was red on code that had passed hours earlier.
  #
  # Bumping this one line is the whole remediation for a stdlib advisory, and it
  # WORKS the day the fix ships rather than whenever GitHub catches up. Kept as an
  # exact version deliberately: `latest` would also jump minor releases and break
  # the build on Go's schedule rather than ours.
  GOTOOLCHAIN: go1.26.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  catalog-floor:
    # The offline floor ships in every image, so a hand-edited or stale bundle
    # would reach every cluster built from this commit. The Go test checks it
    # parses and agrees with catalog-version.txt; this checks the bytes are
    # still the ones a CATALOG-authorized leaf signed.
    name: catalog floor signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The floor check is a Go program now, not `openssl -purpose any`: only
      # the Go verifier can ask whether the signer was authorized for the
      # app-catalog purpose, which is the whole question. See
      # api/cmd/rasputin-catalog-verify.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"
      - name: verify the embedded catalog floor
        env:
          RASPUTIN_ROOT_CA_PEM: ${{ vars.RASPUTIN_ROOT_CA_PEM }}
        run: |
          set -eu
          if [ -z "${RASPUTIN_ROOT_CA_PEM:-}" ]; then
            echo "::error::vars.RASPUTIN_ROOT_CA_PEM is unset; cannot verify the embedded catalog floor"
            exit 1
          fi
          ./scripts/embed-catalog.sh --verify

  release-target-guard:
    # release.yml's publish step runs scripts/release-target-guard.sh before
    # and after `gh release create` to prove the tag is on the commit the
    # binaries were built from (v2026.09.4-dev.164 was tagged on a commit
    # merged mid-build). Every exit status, against a throwaway git remote
    # with lightweight, annotated and nested tags. No network.
    name: release target guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: guard tests
        run: ./scripts/test-release-target-guard.sh

  auth-register:
    # The auth exception register: one canonical authentication method per cell,
    # and every second method recorded with the constraint that forces it and a
    # checkable fact that retires it. The gate refuses a row whose anchored
    # declaration has changed, a revisit trigger that is a date, and a premise
    # recorded as unverified with no probe scheduled to settle it.
    #
    # Policy lives in scripts/auth-register.sh, as sast.yml defers to
    # scripts/sast-register.sh. Its own tests run here too: a gate nobody has
    # fed a bad input to is a gate nobody knows the shape of.
    #
    # No setup-go step and no toolchain: this gate is python3 and the tree.
    name: auth exception register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: register gate
        run: ./scripts/auth-register.sh --gate
      - name: tests for the gate itself
        run: ./scripts/test-auth-register.sh

  failopen:
    # The fail-open lint (api/cmd/failopenlint) and the two registers it holds:
    # .github/failopen-allow.tsv, the recorded verdict for every site a rule
    # fires on, and .github/security-resolvers.tsv, the fail-closed table test
    # each security resolver owes.
    #
    # Every rule is an error and none of them has a severity to lower. An
    # allowance is not a downgrade: the rule still fires, the row carries a
    # verdict and its reasoning, and a `blocked` row cites the issue that
    # closes it. The gate also fails on an allowance that matches nothing any
    # more, so a row cannot outlive the code it described.
    #
    # The lint's own tests run here too — every one of them is a tree it must
    # refuse, which is what lets a reviewer assume those shapes are absent.
    name: fail-open lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"
      - name: lint
        run: go run ./api/cmd/failopenlint
      - name: tests for the lint itself
        run: go test ./api/cmd/failopenlint/...

  backend:
    name: backend (vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # check-latest: fetch the newest 1.26.x rather than reusing whatever
          # patch the runner image happens to have cached. On 2026-08-13 the
          # runner served a cached go1.26.5 while go1.26.6 — which fixes five
          # reachable net/http + encoding/asn1 advisories — was already
          # published, so vuln-scan went red on a commit whose identical code
          # had passed an hour earlier and no re-run could clear it.
          go-version: "1.26"
          check-latest: true
          # Glob, not a literal list: every go.work module's go.sum keys the
          # cache, so adding a module cannot silently leave it out.
          cache-dependency-path: "*/go.sum"

      # The scan gates all derive their module list from go.work now, but
      # Dependabot reads .github/dependabot.yml directly and cannot call a
      # script, so its gomod `directories:` block is the one module list still
      # written by hand. This is the compensating check that keeps it honest —
      # without it, a sixth module would silently get no dependency updates.
      - name: dependabot covers every go.work module
        run: ./scripts/workspace-modules.sh --verify-dependabot

      # Every step below iterates the modules DERIVED from go.work
      # (scripts/workspace-modules.sh) instead of naming them.
      #
      # gofmt -l prints unformatted files; if its output is non-empty,
      # fail the job. Cheaper signal than running goimports in CI.
      - name: gofmt
        run: |
          # Resolve the list into a variable FIRST. Nesting it directly as
          # `gofmt -l $(...)` would, if the helper ever failed, leave gofmt with
          # no path arguments — at which point it reads stdin instead of
          # erroring, and the step passes having formatted nothing.
          modules="$(./scripts/workspace-modules.sh)"
          unformatted=$(gofmt -l $modules)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          for m in $modules; do
            echo "::group::go vet ./$m/..."
            go vet "./$m/..."
            echo "::endgroup::"
          done

      # Coverage profile only for api — it remains the module whose coverage we
      # trend, and that choice is deliberate rather than a list that drifts.
      # Every other module is still TESTED below; it just isn't profiled.
      - name: test (api with coverage)
        run: |
          go test -race -coverprofile=api.coverage.out -covermode=atomic ./api/...

      - name: test (remaining modules)
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          # `if ... then continue; fi`, not `[ ... ] && continue`: the latter
          # yields a non-zero status on the skip branch, which is a `set -e`
          # trap waiting for whichever module happens to sort last.
          for m in $modules; do
            if [ "$m" = "api" ]; then continue; fi
            echo "::group::go test ./$m/..."
            go test -race "./$m/..."
            echo "::endgroup::"
          done

      - name: coverage summary
        run: |
          go tool cover -func=api.coverage.out | tail -1

      - name: build
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          for m in $modules; do
            echo "::group::go build ./$m/..."
            go build "./$m/..."
            echo "::endgroup::"
          done

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: api.coverage.out
          retention-days: 30

  caddy-admin-socket:
    # The node-local Caddy runs as root, and its admin API can rewrite that root
    # process's config. geekdojo-brain#450 moved it off unauthenticated TCP
    # localhost:2019 onto a root-only unix socket. Unit tests can only check the
    # rendered JSON; this runs the agent's own supervisor against the REAL Caddy
    # the OS image ships and proves it on the process: no TCP admin listener even
    # before the first config push, a non-root uid refused by the 0700 directory
    # and by the 0600 socket on its own, a leftover TCP-admin Caddy retired, and
    # a killed Caddy / restarted agent converging back to the same state.
    #
    # It needs root (to be the agent, and to drop to uid 65534 for the refusal),
    # so the test binary is built as the runner user and only RUN under sudo.
    # RASPUTIN_CADDY_FUNCTIONAL=required turns the test's skips into failures,
    # so this job cannot pass by not running.
    name: caddy admin socket (real caddy, root)
    runs-on: ubuntu-latest
    env:
      # Keep in step with rasputin-os package/caddy (caddy.mk + caddy.hash): the
      # point is to test the Caddy the appliance runs. sha512 from the release's
      # caddy_<version>_checksums.txt.
      CADDY_VERSION: "2.11.4"
      CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"

      - name: install the pinned caddy
        run: |
          set -eu
          tarball="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${tarball}"
          echo "${CADDY_SHA512}  $RUNNER_TEMP/$tarball" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/caddy" caddy
          "$RUNNER_TEMP/caddy/caddy" version

      - name: build the proxy test binary
        run: go test -c -race -o "$RUNNER_TEMP/proxy.test" ./agent/internal/proxy

      - name: run the proxy tests as root, against real caddy
        # The whole package, so the root-only unit tests run too.
        run: |
          sudo env \
            RASPUTIN_CADDY_BIN="$RUNNER_TEMP/caddy/caddy" \
            RASPUTIN_CADDY_FUNCTIONAL=required \
            "$RUNNER_TEMP/proxy.test" -test.v -test.count=1

  grafana-obs-socket:
    # Grafana runs in auth-proxy mode: it trusts X-Webauth-User as an identity
    # assertion because the api sets it after validating a passkey session.
    # geekdojo-brain#453 is that it trusted the header from ANY local caller,
    # because it was published on 127.0.0.1:13000 and loopback is not a
    # privilege boundary — naming `admin` yielded Grafana server admin. The fix
    # takes the port away: Grafana serves on a unix socket in a 0700 directory.
    #
    # Unit tests can only check the rendered grafana.ini and compose file. This
    # job runs the api's OWN supervisor against the REAL pinned Grafana image
    # and proves it on the running container: an existing cluster's published
    # port disappears on the next Start with no manual step, the container ends
    # up with no TCP listener at all, a non-owner uid is refused by the 0700
    # directory and by the 0600 socket on its own, the api's dashboards still
    # render, and `admin` is no longer a server admin. A second step puts the
    # api's real /observability/ proxy in front of it and proves the UI still
    # renders: pages, static assets, API calls, and the Live websocket.
    #
    # The same steps prove the starter dashboard's panels return data: each
    # panel's own query, with its own datasource reference, against seeded
    # series in the real VictoriaMetrics — on a fresh install and on an
    # existing cluster whose Grafana DB holds the pre-fix, name-derived
    # datasource uid (grafana_datasource_functional_linux_test.go).
    #
    # It runs under sudo because that is the appliance: the api is root there,
    # so the socket directory is chowned to Grafana's own uid (472) and the
    # container keeps its unprivileged user. RASPUTIN_GRAFANA_FUNCTIONAL=required
    # turns the test's skips into failures, so this job cannot pass by not
    # running.
    name: grafana obs socket (real grafana, root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"

      - name: pre-pull the images the test drives
        # Pulled here, not inside the test, so a registry hiccup reads as a
        # setup failure rather than a supervisor timeout. The tags are the
        # supervisor's own pins. Each pull gets 3 attempts: the first run of
        # this job failed on a single "connection reset by peer" from Docker
        # Hub's auth endpoint before any test ran.
        run: |
          set -eu
          pull() {
            for attempt in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "::warning::docker pull $1 failed (attempt $attempt of 3)"
              [ "$attempt" -lt 3 ] && sleep 10
            done
            echo "::error::docker pull $1 failed 3 times"
            return 1
          }
          pull grafana/grafana:11.5.1
          pull victoriametrics/victoria-metrics:v1.103.0
          pull grafana/alloy:v1.4.2
          pull curlimages/curl:8.11.1

      - name: build the obs test binary
        run: go test -c -race -o "$RUNNER_TEMP/obs.test" ./api/internal/obs

      - name: run the obs tests as root, against real grafana
        # The whole package, so the root-only unit tests run too.
        run: |
          sudo env \
            RASPUTIN_GRAFANA_FUNCTIONAL=required \
            PATH="$PATH" \
            "$RUNNER_TEMP/obs.test" -test.v -test.count=1 -test.timeout=25m

      - name: build the api test binary
        run: go test -c -race -o "$RUNNER_TEMP/api.test" ./api/internal/api

      - name: the UI still renders Grafana through the api proxy (as root)
        # The browser only ever reaches Grafana through the api's
        # /observability/ reverse proxy, now over the socket. This drives the
        # REAL proxy handler against the REAL Grafana: the app shell and every
        # static asset it references, a dashboard page, the API calls the UI
        # makes (incl. a panel query), and a Grafana Live websocket carried
        # through to a Live connect reply. Run after the obs step, never in
        # parallel with it: the compose template pins container names.
        run: |
          sudo env \
            RASPUTIN_GRAFANA_FUNCTIONAL=required \
            PATH="$PATH" \
            "$RUNNER_TEMP/api.test" -test.v -test.count=1 -test.timeout=15m \
              -test.run 'TestObsProxyGrafanaUI_OverSocket'

  frontend:
    # ⚠️ This name is an API, not a label. `main`'s branch protection lists it
    # verbatim as a required status context, and a required context is matched
    # by NAME — so renaming this job here does not rename the requirement: the
    # old context simply stops reporting, and every PR sits at `blocked` with a
    # combined status of `pending` and no failing check to point at. That is
    # what happened on PR #223, where the rename was the only change and all
    # twelve checks were green.
    #
    # So the name UNDER-DESCRIBES the job on purpose (it also runs eslint and
    # `npm test` — see the steps below and the header comment). Changing it
    # requires updating the required_status_checks contexts on `main` in the
    # same change, which is a repo-settings change and Bryce's call.
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Project Node: current LTS (Node 22, LTS through April 2027).
          # Next 16 requires >=20.9.0 (its own engines field), so 22 clears it
          # comfortably — note 16 dropped Node 18, which the previous Next 15
          # note here still listed as supported. Not bumping to 24 until it
          # goes LTS in October 2026.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: install
        run: npm ci

      # eslint runs first because it is the cheapest of the three and, until
      # 2026-08-16, did not run at all: the repo carried nine eslint-disable
      # comments waiving rules for a linter that was in neither dependencies nor
      # devDependencies and that ci.yml never invoked. Those comments read as
      # nine reviewed exceptions; no linter had ever evaluated the lines.
      #
      # Errors fail. Warnings print and do not fail — the react-hooks
      # exhaustive-deps warnings are kept deliberately visible as pointers to
      # investigate if the UI misbehaves, and making them blockers would only
      # get them suppressed again.
      #
      # The release path is gated too, in scripts/build-release.sh, so a release
      # cannot be cut from code that fails this.
      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run type-check

      # ui/ had no test runner at all until 2026-09-01, which meant the §4.6
      # archive-key crypto — the part of this frontend where a silent mistake
      # costs an operator their backup — was covered by nothing. `npm test`
      # compiles lib/ and components/storage/ to CommonJS and runs them under
      # node --test; it adds no dependency to package.json, deliberately (see
      # ui/tsconfig.test.json for why that mattered here).
      - name: test
        run: npm test

      # Next build catches a class of errors tsc doesn't: missing 'use
      # client' directives, server/client component boundary violations,
      # bad dynamic imports. It also produces the static export (out/)
      # that release tarballs ship — so assert it actually materialized.
      # (NEXT_PUBLIC_API_BASE is computed inside next.config.mjs from
      # NODE_ENV; production builds bake in same-origin paths.)
      - name: build
        run: npm run build

      - name: assert static export
        run: test -f out/index.html && test -f out/login.html
