name: ci

# Safety net for every push and PR. Jobs, in parallel:
#
#   catalog-floor — the embedded catalog floor still carries the publisher's
#              signature, made by a leaf authorized to sign catalogs
#              (scripts/embed-catalog.sh --verify).
#
#   release-target-guard — tests for scripts/release-target-guard.sh, which
#              release.yml runs to prove a release tag is on the built commit,
#              and for scripts/pack-store-policy.sh, which build-release.sh
#              runs to pack the secrets store's policy text, and for
#              scripts/pack-identity.sh, which packs identity/ and checks the
#              realm baseline against its drift lock, and for
#              scripts/fetch-denylist.sh, which fetches the pinned password
#              deny list the pack carries, and for
#              scripts/tileschema-contract.sh, which this file's backend job
#              and tileschema-tag.yml run.
#
#   auth-register — .github/auth-register.tsv still describes the code it
#              anchors to (scripts/auth-register.sh --gate), plus the gate's
#              own tests. python3 only.
#
#   failopen — the fail-open lint (api/cmd/failopenlint) over the whole tree,
#              its allowance register, the security-resolver register, and the
#              lint's own tests.
#
#   backend  — gofmt + go vet + go build + go test for EVERY module in
#              go.work, enumerated by scripts/workspace-modules.sh rather
#              than listed here (it said api / agent / proto long after the
#              workspace grew artifactsig and tileschema, so neither was
#              built, vetted or tested — and both ship tests that therefore
#              never ran). api's coverage is uploaded as a build artifact so
#              we can watch it trend over time. Failures gate merges via
#              branch-protection (configured outside this file). The api test
#              step sets RASPUTIN_APPSECRET_FUNCTIONAL=required, so the
#              appsecret Compose functional test must run against the runner's
#              real Compose and pass rather than skip (geekdojo-brain#695); the
#              remaining-modules step sets it too, for the agent's (#776).
#              It also installs the pinned secret store with
#              scripts/install-openbao.sh and sets
#              RASPUTIN_SECRETSTORE_FUNCTIONAL=required, so the secret store
#              smoke test must run against the real OpenBao and pass rather
#              than skip (geekdojo-brain#753, docs/testing-secret-store.md).
#              Likewise it installs the pinned identity service, database and
#              browser with scripts/install-identity.sh and sets
#              RASPUTIN_IDENTITY_FUNCTIONAL=required, so the identity harness's
#              self-test must run against the real Keycloak and pass
#              (geekdojo-brain#966, docs/testing-identity.md), and it refuses a
#              shipped api that links chromedp.
#              And it refuses a tileschema contract change that did not bump
#              ContractMinor over the latest tileschema/v* tag
#              (scripts/tileschema-contract.sh check, geekdojo-brain#897).
#
#   caddy-admin-socket — the agent's Caddy supervisor against the real Caddy
#              the OS image ships, run as root: the admin API is reachable
#              only through a root-only unix socket (geekdojo-brain#450).
#
#   frontend — eslint + TypeScript type-check + `npm test` (node --test) +
#              Next.js production build. Catches type regressions and
#              build-time errors (Server Components, missing 'use client',
#              stale imports) that tsc alone misses, and executes the §4.6
#              archive-key crypto rather than only compiling it.
#
# Conventions match release.yml: Go 1.26, actions/setup-go@v5 with cache
# keyed on the workspace's go.sum files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Opt into the Node.js 24 runner for JavaScript-based actions now, ahead of
# the GitHub-forced migration on 2026-06-16. Removes the deprecation
# annotation that the first run flagged.
env:
  # GOTOOLCHAIN: the go command fetches this toolchain itself, from the module
  # proxy, instead of using whatever actions/setup-go could resolve. That matters
  # because setup-go resolves against GitHub's actions/go-versions manifest, which
  # LAGS go.dev — on 2026-08-13 go1.26.6 was published and fixed five reachable
  # net/http + encoding/asn1 advisories, but the manifest still topped out at
  # 1.26.5, so neither `go-version: "1.26"` nor check-latest could obtain the fix
  # and vuln-scan was red on code that had passed hours earlier.
  #
  # Bumping this one line is the whole remediation for a stdlib advisory, and it
  # WORKS the day the fix ships rather than whenever GitHub catches up. Kept as an
  # exact version deliberately: `latest` would also jump minor releases and break
  # the build on Go's schedule rather than ours.
  GOTOOLCHAIN: go1.26.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  catalog-floor:
    # The offline floor ships in every image, so a hand-edited or stale bundle
    # would reach every cluster built from this commit. The Go test checks it
    # parses and agrees with catalog-version.txt; this checks the bytes are
    # still the ones a CATALOG-authorized leaf signed.
    name: catalog floor signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The floor check is a Go program now, not `openssl -purpose any`: only
      # the Go verifier can ask whether the signer was authorized for the
      # app-catalog purpose, which is the whole question. See
      # api/cmd/rasputin-catalog-verify.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"
      - name: verify the embedded catalog floor
        env:
          RASPUTIN_ROOT_CA_PEM: ${{ vars.RASPUTIN_ROOT_CA_PEM }}
        run: |
          set -eu
          if [ -z "${RASPUTIN_ROOT_CA_PEM:-}" ]; then
            echo "::error::vars.RASPUTIN_ROOT_CA_PEM is unset; cannot verify the embedded catalog floor"
            exit 1
          fi
          ./scripts/embed-catalog.sh --verify

  release-target-guard:
    # release.yml's publish step runs scripts/release-target-guard.sh before
    # and after `gh release create` to prove the tag is on the commit the
    # binaries were built from (v2026.09.4-dev.164 was tagged on a commit
    # merged mid-build). Every exit status, against a throwaway git remote
    # with lightweight, annotated and nested tags. No network.
    name: release target guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: guard tests
        run: ./scripts/test-release-target-guard.sh
      # scripts/pack-store-policy.sh, which build-release.sh runs to put the
      # secrets store's policy text in every api tarball: the copy is
      # byte-equal, and an empty source is refused (geekdojo/geekdojo-brain#804,
      # TC-804-09).
      - name: store policy packing tests
        run: ./scripts/test-pack-store-policy.sh
      # scripts/pack-identity.sh, which build-release.sh runs to put identity/
      # in every api tarball: the four entries, every refusal (an unknown build
      # option, a baseline that does not match its lock, a missing or malformed
      # lock, input or pin), the baseline's settings, and the shared pin reader
      # in scripts/lib/release-lib.sh (geekdojo/geekdojo-brain#980).
      - name: identity packing tests
        run: ./scripts/test-pack-identity.sh
      # scripts/fetch-denylist.sh, which build-release.sh and
      # install-identity.sh run to fetch the pinned password deny list, and
      # the pinned download it shares with the installers (fetch_pinned in
      # scripts/lib/release-lib.sh): a source or notice off its pin refused,
      # kept downloads reused and a bad one left in place, the cut at the
      # realm's length(N) into the realm's DenylistFile, each refusal writing
      # nothing; and git keeping no list by hand (geekdojo/geekdojo-brain#1145).
      # A curl stub serves the fixtures; no network.
      - name: deny list fetch tests
        run: ./scripts/test-fetch-denylist.sh
      # scripts/tileschema-contract.sh: the contract version, the CI gate on
      # it, and the tagger tileschema-tag.yml runs (geekdojo/geekdojo-brain#897).
      - name: tileschema contract script tests
        run: ./scripts/test-tileschema-contract.sh

  auth-register:
    # The auth exception register: one canonical authentication method per cell,
    # and every second method recorded with the constraint that forces it and a
    # checkable fact that retires it. The gate refuses a row whose anchored
    # declaration has changed, a revisit trigger that is a date, and a premise
    # recorded as unverified with no probe scheduled to settle it.
    #
    # Policy lives in scripts/auth-register.sh, as sast.yml defers to
    # scripts/sast-register.sh. Its own tests run here too: a gate nobody has
    # fed a bad input to is a gate nobody knows the shape of.
    #
    # No setup-go step and no toolchain: this gate is python3 and the tree.
    name: auth exception register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: register gate
        run: ./scripts/auth-register.sh --gate
      - name: tests for the gate itself
        run: ./scripts/test-auth-register.sh

  failopen:
    # The fail-open lint (api/cmd/failopenlint) and the two registers it holds:
    # .github/failopen-allow.tsv, the recorded verdict for every site a rule
    # fires on, and .github/security-resolvers.tsv, the fail-closed table test
    # each security resolver owes.
    #
    # Every rule is an error and none of them has a severity to lower. An
    # allowance is not a downgrade: the rule still fires, the row carries a
    # verdict and its reasoning, and a `blocked` row cites the issue that
    # closes it. The gate also fails on an allowance that matches nothing any
    # more, so a row cannot outlive the code it described.
    #
    # The lint's own tests run here too — every one of them is a tree it must
    # refuse, which is what lets a reviewer assume those shapes are absent.
    name: fail-open lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"
      - name: lint
        run: go run ./api/cmd/failopenlint
      - name: tests for the lint itself
        run: go test ./api/cmd/failopenlint/...
      # The secret.Value analyzer (ADR-0009, api/cmd/secretlint): every
      # Reveal outside .github/secret-reveal-allow.tsv, and any unsafe or
      # reflect access to a type that holds a secret.Value, fails the build.
      # It lints every go.work module, derived rather than listed, so a module
      # that starts importing the type is covered the day it does. The
      # splitting of $patterns into one argument per module is deliberate, as
      # in the backend job's vet and test loops. Its tests run in the backend
      # job's go test ./api/...
      - name: secret.Value analyzer
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          patterns=""; for m in $modules; do patterns="$patterns ./$m/..."; done
          go run ./api/cmd/secretlint $patterns

  backend:
    name: backend (vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # check-latest: fetch the newest 1.26.x rather than reusing whatever
          # patch the runner image happens to have cached. On 2026-08-13 the
          # runner served a cached go1.26.5 while go1.26.6 — which fixes five
          # reachable net/http + encoding/asn1 advisories — was already
          # published, so vuln-scan went red on a commit whose identical code
          # had passed an hour earlier and no re-run could clear it.
          go-version: "1.26"
          check-latest: true
          # Glob, not a literal list: every go.work module's go.sum keys the
          # cache, so adding a module cannot silently leave it out.
          cache-dependency-path: "*/go.sum"

      # The scan gates all derive their module list from go.work now, but
      # Dependabot reads .github/dependabot.yml directly and cannot call a
      # script, so its gomod `directories:` block is the one module list still
      # written by hand. This is the compensating check that keeps it honest —
      # without it, a sixth module would silently get no dependency updates.
      - name: dependabot covers every go.work module
        run: ./scripts/workspace-modules.sh --verify-dependabot

      # Every step below iterates the modules DERIVED from go.work
      # (scripts/workspace-modules.sh) instead of naming them.
      #
      # gofmt -l prints unformatted files; if its output is non-empty,
      # fail the job. Cheaper signal than running goimports in CI.
      - name: gofmt
        run: |
          # Resolve the list into a variable FIRST. Nesting it directly as
          # `gofmt -l $(...)` would, if the helper ever failed, leave gofmt with
          # no path arguments — at which point it reads stdin instead of
          # erroring, and the step passes having formatted nothing.
          modules="$(./scripts/workspace-modules.sh)"
          unformatted=$(gofmt -l $modules)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # The tileschema contract (ADR-0012, geekdojo/geekdojo-brain#897): a
      # change to the contract surface golden must raise ContractMinor above
      # the latest tileschema/v* tag. The checkout is shallow and carries no
      # tags, so the tileschema tag line is fetched first; with no tag the
      # check fails rather than passing unchecked. TestContractSurface, which
      # keeps the golden equal to the code, runs in "test (remaining modules)".
      - name: tileschema contract version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '+refs/tags/tileschema/*:refs/tags/tileschema/*'
          ./scripts/tileschema-contract.sh check

      - name: vet
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          for m in $modules; do
            echo "::group::go vet ./$m/..."
            go vet "./$m/..."
            echo "::endgroup::"
          done

      # The real secret store for TestSecretStore_SmokeWriteReadKV: the release
      # and sha256 are read from api/internal/secretstoretest/pin.go, so this
      # downloads exactly what the Go const pins (docs/testing-secret-store.md).
      # The tarball comes from the Actions cache when it holds one, so a
      # github.com release-download outage cannot fail this job: on 2026-11-09
      # GitHub served 504s to anonymous release downloads for three hours and
      # every PR's backend job went red at this step. The script checks a
      # cached tarball against the pinned sha256 exactly as it checks a fresh
      # download, and the cache is saved only after that check has passed.
      - name: restore the pinned secret store tarball
        id: openbao-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/openbao-download
          key: openbao-${{ runner.os }}-${{ hashFiles('api/internal/secretstoretest/pin.go') }}

      - name: install the pinned secret store
        run: ./scripts/install-openbao.sh "$RUNNER_TEMP/openbao" "$RUNNER_TEMP/openbao-download"

      - name: save the pinned secret store tarball
        if: steps.openbao-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/openbao-download
          key: ${{ steps.openbao-cache.outputs.cache-primary-key }}

      # The real identity service for api/internal/identitytest's self-test:
      # Keycloak, the JRE and Chrome for Testing, read from
      # api/internal/identitytest/pin.go, plus the pinned PostgreSQL and
      # Headscale images (docs/testing-identity.md). The downloads come from
      # the Actions cache when it holds them, as the secret store's do, and are
      # checked against the pins exactly as a fresh download is; the cache is
      # saved only after that check has passed.
      - name: restore the pinned identity downloads
        id: identity-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/identity-download
          key: identity-${{ runner.os }}-${{ hashFiles('api/internal/identitytest/pin.go') }}

      - name: install the pinned identity service, database and browser
        run: ./scripts/install-identity.sh "$RUNNER_TEMP/identity" "$RUNNER_TEMP/identity-download"

      - name: save the pinned identity downloads
        if: steps.identity-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/identity-download
          key: ${{ steps.identity-cache.outputs.cache-primary-key }}

      # The browser automation library is test support only. The shipped api
      # must not link it; the same pattern must match identitytest, which
      # does, so a pattern that drifted cannot pass silently.
      - name: shipped api binary carries no chromedp
        run: |
          pattern='^github.com/chromedp/'
          shipped="$(go list -deps ./api/cmd/rasputin-api)"
          if found="$(printf '%s\n' "$shipped" | grep -E "$pattern")"; then
            echo "::error::the shipped api links chromedp:"
            echo "$found"
            exit 1
          fi
          echo "go list -deps ./api/cmd/rasputin-api: no package matches $pattern"
          harness="$(go list -deps ./api/internal/identitytest)"
          if ! control="$(printf '%s\n' "$harness" | grep -E "$pattern")"; then
            echo "::error::positive control failed: $pattern matches nothing in go list -deps ./api/internal/identitytest"
            exit 1
          fi
          echo "positive control: go list -deps ./api/internal/identitytest matches $pattern:"
          echo "$control"

      # Coverage profile only for api — it remains the module whose coverage we
      # trend, and that choice is deliberate rather than a list that drifts.
      # Every other module is still TESTED below; it just isn't profiled.
      # The sign-in theme the identity walk renders
      # (geekdojo/geekdojo-brain#988): built here by ui/identity-theme's node
      # script, Node built-ins only, so no npm install.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: build the sign-in theme
        run: node ui/identity-theme/build.mjs "$RUNNER_TEMP/identity-theme"

      - name: test (api with coverage)
        env:
          # Turns the appsecret Compose test's skips into failures: a runner
          # without docker or the Compose plugin fails this required job
          # instead of passing having tested nothing (geekdojo-brain#695,
          # docs/testing-appsecret-compose.md).
          RASPUTIN_APPSECRET_FUNCTIONAL: required
          # The same for the secret store smoke test: the binary the step
          # above installed, and a missing one fails this required job
          # (geekdojo-brain#753, docs/testing-secret-store.md). The app relay's
          # scope test runs on the same switch (docs/testing-app-relay.md).
          RASPUTIN_SECRETSTORE_BIN: ${{ runner.temp }}/openbao/bao
          RASPUTIN_SECRETSTORE_FUNCTIONAL: required
          # The same for the identity harness's self-test: the install the
          # steps above made, and a missing dependency fails this required
          # job (geekdojo-brain#966, docs/testing-identity.md).
          RASPUTIN_IDENTITY_HOME: ${{ runner.temp }}/identity
          RASPUTIN_IDENTITY_FUNCTIONAL: required
          # The built sign-in theme, linked as the harness's themes/rasputin;
          # unset, the theme walk fails under required (TC-988-28).
          RASPUTIN_IDENTITY_THEME: ${{ runner.temp }}/identity-theme
        # -timeout 25m: api/internal/identitytest measured 460 s on main
        # before geekdojo/geekdojo-brain#987, whose TC-987-20 leaves a
        # sign-in page open 6 minutes by definition (past Keycloak's stock
        # 5-minute action timeout), so the package passes go test's default
        # 10-minute limit. 25 minutes bounds a hung run, and decides nothing.
        run: |
          go test -race -timeout 25m -coverprofile=api.coverage.out -covermode=atomic ./api/...

      # The console's own pages under their page policy, in the pinned Chrome
      # the steps above installed (geekdojo/geekdojo-brain#999, CI UI-1's
      # console part): every page of the static export, served by the api's
      # real handler, over plain HTTP, over TLS at rasputin.local and on the
      # plain-HTTP trust page, with no 'unsafe-inline' and no violation, and
      # a negative control that proves a violation is recorded.
      # RASPUTIN_CONSOLE_FUNCTIONAL=required turns a missing export or browser
      # into a failure; the step above runs the same test, where it skips.
      # The same export is the UI the console stack test's api serves
      # (TestIdentitySystemd_ConsoleSignIn, geekdojo/geekdojo-brain#989).
      - name: build the console export
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: test (console pages under their script policy, pinned Chrome)
        env:
          RASPUTIN_CONSOLE_FUNCTIONAL: required
          RASPUTIN_CONSOLE_UI_DIR: ${{ github.workspace }}/ui/out
          RASPUTIN_IDENTITY_HOME: ${{ runner.temp }}/identity
        run: |
          go test -race -count=1 -v -run '^TestConsolePagesPolicy' ./api/internal/api

      # The identity tests that need root and the runner's real systemd
      # (geekdojo/geekdojo-brain#979, docs/testing-identity.md): the pinned
      # PostgreSQL and Keycloak run as transient units, so the states they
      # read are systemd's own. The test binary is built as the runner user
      # and only RUN under sudo, from its package directory so testdata/
      # resolves. RASPUTIN_IDENTITY_SYSTEMD_FUNCTIONAL=required turns their
      # skips into failures, so this step cannot pass by not running; the
      # step above runs the same tests unprivileged, where they skip. A test
      # binary run directly has no default timeout, so -test.timeout gives it
      # go test's own 10m: the tests' waits end before it with an error that
      # names the fact they waited for, and their cleanup still runs. The
      # console stack test (#989) starts the real api and waits on its
      # converge, and the break-glass test (#321) starts a second stack and
      # restarts its identity service and its api, so the bound is 30m.
      - name: test (identity under real systemd, root)
        run: |
          go test -c -race -o "$RUNNER_TEMP/identitytest.test" ./api/internal/identitytest
          go build -o "$RUNNER_TEMP/rasputin-api" ./api/cmd/rasputin-api
          cd api/internal/identitytest
          sudo env \
            PATH="$PATH" \
            RASPUTIN_IDENTITY_HOME="$RUNNER_TEMP/identity" \
            RASPUTIN_IDENTITY_FUNCTIONAL=required \
            RASPUTIN_IDENTITY_SYSTEMD_FUNCTIONAL=required \
            RASPUTIN_IDENTITY_THEME="$RUNNER_TEMP/identity-theme" \
            RASPUTIN_UI_DIR="$GITHUB_WORKSPACE/ui/out" \
            RASPUTIN_API_BIN="$RUNNER_TEMP/rasputin-api" \
            "$RUNNER_TEMP/identitytest.test" -test.v -test.count=1 -test.timeout=30m -test.run '^TestIdentitySystemd_'

      # CI SO-19 (geekdojo/geekdojo-brain#995): the home sign-in name's mDNS
      # responder in two network namespaces joined by a veth pair, beside a
      # wildcard SO_REUSEADDR socket on 5353 playing the part of resolved. It
      # needs root to make the namespaces, so the binary is built as the runner
      # user and only RUN under sudo; the step above runs the same test
      # unprivileged, where it skips. RASPUTIN_SIGNINNAME_FUNCTIONAL=required
      # turns a missing ip tool or namespace support into a failure. What it
      # proves is in functional_linux_test.go.
      - name: test (sign-in name responder in network namespaces, root)
        run: |
          go test -c -race -o "$RUNNER_TEMP/signinname.test" ./api/internal/signinname
          cd api/internal/signinname
          sudo env \
            PATH="$PATH" \
            RASPUTIN_SIGNINNAME_FUNCTIONAL=required \
            "$RUNNER_TEMP/signinname.test" -test.v -test.count=1 -test.timeout=10m -test.run '^TestSO19_'

      - name: test (remaining modules)
        env:
          # The agent's Compose test for secret values carried beside the
          # compose (geekdojo-brain#776) must run against the runner's real
          # Compose and pass rather than skip, as the api's does above
          # (docs/testing-appsecret-compose.md); so must the app relay's mount
          # test (docs/testing-app-relay.md).
          RASPUTIN_APPSECRET_FUNCTIONAL: required
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          # `if ... then continue; fi`, not `[ ... ] && continue`: the latter
          # yields a non-zero status on the skip branch, which is a `set -e`
          # trap waiting for whichever module happens to sort last.
          for m in $modules; do
            if [ "$m" = "api" ]; then continue; fi
            echo "::group::go test ./$m/..."
            go test -race "./$m/..."
            echo "::endgroup::"
          done

      # The compatibility tests for the release that deleted the plaintext bus
      # ladder (geekdojo/geekdojo-brain#517): an agent built from the floor
      # release v2026.09.5 on this api, and this agent on that release's api.
      # A step inside this required job, so a failure blocks the merge. The
      # checkout is shallow and carries no tags, so the one tag is fetched;
      # the script builds both old binaries from it, runs the -tags buscompat
      # tests, and fails on a missing tag, a failed build, a skipped or failed
      # test, or fewer than two top-level TestCompat* passes. Proven on amd64
      # (this runner) only; arm64 is the bench. Remove it once no known cluster
      # runs a release below this one.
      - name: bus TLS compatibility (v2026.09.5 floor)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tag v2026.09.5
          ./scripts/test-bus-tls.sh --compat

      # The release-build branch (geekdojo/geekdojo-brain#529): the tests
      # compiled only under -tags release, which shipped binaries carry, and
      # the assertion build-release.sh runs on each binary before packing it.
      - name: release build tag
        run: |
          go test -tags release -run 'ReleaseBuild' -v ./artifactsig/... ./api/cmd/rasputin-api/...
          ./scripts/test-assert-release-tag.sh

      - name: coverage summary
        run: |
          go tool cover -func=api.coverage.out | tail -1

      - name: build
        run: |
          modules="$(./scripts/workspace-modules.sh)"
          for m in $modules; do
            echo "::group::go build ./$m/..."
            go build "./$m/..."
            echo "::endgroup::"
          done

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: api.coverage.out
          retention-days: 30

  caddy-admin-socket:
    # The node-local Caddy runs as root, and its admin API can rewrite that root
    # process's config. geekdojo-brain#450 moved it off unauthenticated TCP
    # localhost:2019 onto a root-only unix socket. Unit tests can only check the
    # rendered JSON; this runs the agent's own supervisor against the REAL Caddy
    # the OS image ships and proves it on the process: no TCP admin listener even
    # before the first config push, a non-root uid refused by the 0700 directory
    # and by the 0600 socket on its own, a leftover TCP-admin Caddy retired, and
    # a killed Caddy / restarted agent converging back to the same state.
    #
    # The same package also carries geekdojo-brain#611's regression: a renewed
    # app leaf delivered over the agent's own NATS path must be SERVED by the
    # running Caddy (the handshake's serial changes, no restart, the other app
    # undisturbed), and an unchanged re-delivery must not reload it. Caddy
    # no-ops a byte-identical /load, so only a real Caddy can show either.
    #
    # It needs root (to be the agent, and to drop to uid 65534 for the refusal),
    # so the test binary is built as the runner user and only RUN under sudo.
    # RASPUTIN_CADDY_FUNCTIONAL=required turns the test's skips into failures,
    # so this job cannot pass by not running.
    name: caddy admin socket (real caddy, root)
    runs-on: ubuntu-latest
    env:
      # Keep in step with rasputin-os package/caddy (caddy.mk + caddy.hash): the
      # point is to test the Caddy the appliance runs. sha512 from the release's
      # caddy_<version>_checksums.txt.
      CADDY_VERSION: "2.11.4"
      CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"

      # The tarball comes from the Actions cache when it holds one, for the
      # reason the backend job caches the secret store's: a github.com
      # release-download outage (504s on 2026-11-09) must not fail this job.
      # A cached tarball gets the same sha512 check as a fresh download, and
      # the cache is saved only after that check has passed.
      - name: restore the pinned caddy tarball
        id: caddy-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/caddy-download
          key: caddy-${{ runner.os }}-${{ env.CADDY_VERSION }}-${{ env.CADDY_SHA512 }}

      - name: install the pinned caddy
        run: |
          set -eu
          tarball="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          dl="$RUNNER_TEMP/caddy-download"
          mkdir -p "$dl"
          if [ -f "$dl/$tarball" ]; then
            echo "using the cached $dl/$tarball"
          else
            curl -fsSL -o "$dl/$tarball.part" \
              "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${tarball}"
            mv "$dl/$tarball.part" "$dl/$tarball"
          fi
          echo "${CADDY_SHA512}  $dl/$tarball" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf "$dl/$tarball" -C "$RUNNER_TEMP/caddy" caddy
          "$RUNNER_TEMP/caddy/caddy" version

      - name: save the pinned caddy tarball
        if: steps.caddy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/caddy-download
          key: ${{ steps.caddy-cache.outputs.cache-primary-key }}

      - name: build the proxy test binary
        run: go test -c -race -o "$RUNNER_TEMP/proxy.test" ./agent/internal/proxy

      - name: run the proxy tests as root, against real caddy
        # The whole package, so the root-only unit tests run too.
        run: |
          sudo env \
            RASPUTIN_CADDY_BIN="$RUNNER_TEMP/caddy/caddy" \
            RASPUTIN_CADDY_FUNCTIONAL=required \
            "$RUNNER_TEMP/proxy.test" -test.v -test.count=1

  grafana-obs-socket:
    # Grafana runs in auth-proxy mode: it trusts X-Webauth-User as an identity
    # assertion because the api sets it after validating a passkey session.
    # geekdojo-brain#453 is that it trusted the header from ANY local caller,
    # because it was published on 127.0.0.1:13000 and loopback is not a
    # privilege boundary — naming `admin` yielded Grafana server admin. The fix
    # takes the port away: Grafana serves on a unix socket in a 0700 directory.
    #
    # Unit tests can only check the rendered grafana.ini and compose file. This
    # job runs the api's OWN supervisor against the REAL pinned Grafana image
    # and proves it on the running container: an existing cluster's published
    # port disappears on the next Start with no manual step, the container ends
    # up with no TCP listener at all, a non-owner uid is refused by the 0700
    # directory and by the 0600 socket on its own, the api's dashboards still
    # render, and `admin` is no longer a server admin. A second step puts the
    # api's real /observability/ proxy in front of it and proves the UI still
    # renders: pages, static assets, API calls, and the Live websocket.
    #
    # The same steps prove the starter dashboard's panels return data: each
    # panel's own query, with its own datasource reference, against seeded
    # series in the real VictoriaMetrics, on a fresh install and on an
    # existing cluster whose Grafana 11.5.1 database still holds the
    # datasource under its derived uid, started at the new pin
    # (grafana_datasource_functional_linux_test.go). They also prove
    # Grafana's own script policy (geekdojo/geekdojo-brain#999): every
    # response through the proxy that passes Grafana's CSP middleware carries
    # it with a fresh nonce, and every provisioned dashboard renders under it
    # in the pinned Chrome.
    #
    # It runs under sudo because that is the appliance: the api is root there,
    # so the socket directory is chowned to Grafana's own uid (472) and the
    # container keeps its unprivileged user. RASPUTIN_GRAFANA_FUNCTIONAL=required
    # turns the test's skips into failures, so this job cannot pass by not
    # running.
    name: grafana obs socket (real grafana, root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: "*/go.sum"

      - name: pre-pull the images the test drives
        # Pulled here, not inside the test, so a registry hiccup reads as a
        # setup failure rather than a supervisor timeout. The tags are the
        # supervisor's own pins. Each pull gets 3 attempts: the first run of
        # this job failed on a single "connection reset by peer" from Docker
        # Hub's auth endpoint before any test ran.
        run: |
          set -eu
          pull() {
            for attempt in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "::warning::docker pull $1 failed (attempt $attempt of 3)"
              [ "$attempt" -lt 3 ] && sleep 10
            done
            echo "::error::docker pull $1 failed 3 times"
            return 1
          }
          pull grafana/grafana:13.3.1
          # The Grafana existing clusters ran before the 13.3.1 pin: the
          # datasource-uid transition test starts from its database.
          pull grafana/grafana:11.5.1
          pull victoriametrics/victoria-metrics:v1.103.0
          pull grafana/alloy:v1.4.2
          pull grafana/loki:3.4.1
          pull curlimages/curl:8.11.1

      # The pinned Chrome the dashboard walk renders Grafana in, from the
      # identity installer the backend job runs, through the same cache
      # (api/internal/identitytest/pin.go pins it).
      - name: restore the pinned identity downloads
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/identity-download
          key: identity-${{ runner.os }}-${{ hashFiles('api/internal/identitytest/pin.go') }}

      - name: install the pinned browser
        run: ./scripts/install-identity.sh "$RUNNER_TEMP/identity" "$RUNNER_TEMP/identity-download"

      - name: build the obs test binary
        run: go test -c -race -o "$RUNNER_TEMP/obs.test" ./api/internal/obs

      - name: run the obs tests as root, against real grafana
        # The whole package, so the root-only unit tests run too. That
        # includes the outcome journal source against the real pinned Alloy
        # and Loki, reading this runner's own journal
        # (journal_pipe_functional_linux_test.go, geekdojo-brain#853);
        # RASPUTIN_JOURNAL_FUNCTIONAL=required makes it fail rather than skip.
        # The same for the secret store's audit source, shipped and followed
        # across a rotation and a recreate by the real Alloy and Loki
        # (storeaudit_pipe_functional_linux_test.go, geekdojo-brain#802).
        run: |
          sudo env \
            RASPUTIN_GRAFANA_FUNCTIONAL=required \
            RASPUTIN_JOURNAL_FUNCTIONAL=required \
            RASPUTIN_STOREAUDIT_FUNCTIONAL=required \
            PATH="$PATH" \
            "$RUNNER_TEMP/obs.test" -test.v -test.count=1 -test.timeout=25m

      - name: build the api test binary
        run: go test -c -race -o "$RUNNER_TEMP/api.test" ./api/internal/api

      - name: the UI still renders Grafana through the api proxy (as root)
        # The browser only ever reaches Grafana through the api's
        # /observability/ reverse proxy, now over the socket. This drives the
        # REAL proxy handler against the REAL Grafana: the app shell and every
        # static asset it references, a dashboard page, the API calls the UI
        # makes (incl. a panel query), and a Grafana Live websocket carried
        # through to a Live connect reply. It also checks Grafana's own
        # script policy on those responses and renders every provisioned
        # dashboard in the pinned Chrome (geekdojo/geekdojo-brain#999). Run
        # after the obs step, never in parallel with it: the compose template
        # pins container names.
        run: |
          sudo env \
            RASPUTIN_GRAFANA_FUNCTIONAL=required \
            RASPUTIN_IDENTITY_HOME="$RUNNER_TEMP/identity" \
            PATH="$PATH" \
            "$RUNNER_TEMP/api.test" -test.v -test.count=1 -test.timeout=15m \
              -test.run 'TestObsProxyGrafanaUI_OverSocket'

  frontend:
    # ⚠️ This name is an API, not a label. `main`'s branch protection lists it
    # verbatim as a required status context, and a required context is matched
    # by NAME — so renaming this job here does not rename the requirement: the
    # old context simply stops reporting, and every PR sits at `blocked` with a
    # combined status of `pending` and no failing check to point at. That is
    # what happened on PR #223, where the rename was the only change and all
    # twelve checks were green.
    #
    # So the name UNDER-DESCRIBES the job on purpose (it also runs eslint and
    # `npm test` — see the steps below and the header comment). Changing it
    # requires updating the required_status_checks contexts on `main` in the
    # same change, which is a repo-settings change and Bryce's call.
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Project Node: current LTS (Node 22, LTS through April 2027).
          # Next 16 requires >=20.9.0 (its own engines field), so 22 clears it
          # comfortably — note 16 dropped Node 18, which the previous Next 15
          # note here still listed as supported. Not bumping to 24 until it
          # goes LTS in October 2026.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: install
        run: npm ci

      # eslint runs first because it is the cheapest of the three and, until
      # 2026-08-16, did not run at all: the repo carried nine eslint-disable
      # comments waiving rules for a linter that was in neither dependencies nor
      # devDependencies and that ci.yml never invoked. Those comments read as
      # nine reviewed exceptions; no linter had ever evaluated the lines.
      #
      # Errors fail. Warnings print and do not fail — the react-hooks
      # exhaustive-deps warnings are kept deliberately visible as pointers to
      # investigate if the UI misbehaves, and making them blockers would only
      # get them suppressed again.
      #
      # The release path is gated too, in scripts/build-release.sh, so a release
      # cannot be cut from code that fails this.
      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run type-check

      # ui/ had no test runner at all until 2026-09-01, which meant the §4.6
      # archive-key crypto — the part of this frontend where a silent mistake
      # costs an operator their backup — was covered by nothing. `npm test`
      # compiles lib/, components/storage/ and the component tests to CommonJS
      # and runs them under node --test. Its one test dependency is happy-dom,
      # the DOM the component tests render into (see ui/tsconfig.test.json for
      # why dependencies here are added one decision at a time).
      - name: test
        run: npm test

      # Next build catches a class of errors tsc doesn't: missing 'use
      # client' directives, server/client component boundary violations,
      # bad dynamic imports. It also produces the static export (out/)
      # that release tarballs ship — so assert it actually materialized.
      # (NEXT_PUBLIC_API_BASE is computed inside next.config.mjs from
      # NODE_ENV; production builds bake in same-origin paths.)
      - name: build
        run: npm run build

      - name: assert static export
        run: test -f out/index.html && test -f out/login.html

      # The console bundles JetBrains Mono (ui/styles/fonts) instead of loading
      # it from Google Fonts, whose two CSP allowances are gone
      # (geekdojo/geekdojo-brain#988, TC-988-17): the export names neither
      # Google host, carries the three woff2 files, and every @font-face URL in
      # its CSS resolves to a file in out/.
      - name: the console bundles its font
        run: |
          set -eu
          if grep -rlE 'fonts\.(googleapis|gstatic)\.com' out; then
            echo "::error::the static export references Google Fonts (listed above)"
            exit 1
          fi
          echo "zero references to fonts.googleapis.com or fonts.gstatic.com in out/"
          for w in Regular Medium SemiBold; do
            ls out/_next/static/media/JetBrainsMono-"$w".*.woff2
          done
          n=0
          for css in $(find out -name '*.css'); do
            dir="$(dirname "$css")"
            for u in $(grep -oE '@font-face\{[^}]*\}' "$css" | grep -oE 'url\([^)]*\)' | sed -E "s/^url\([\"']?//; s/[\"']?\)$//"); do
              if [ ! -f "$dir/$u" ]; then
                echo "::error::$css names the font $u, which is not in out/"
                exit 1
              fi
              n=$((n + 1))
            done
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::no @font-face URL in the static export"
            exit 1
          fi
          echo "$n @font-face URLs resolve to files in out/"

      # The sign-in theme (geekdojo/geekdojo-brain#988): built by the same
      # node script the release runs, so a theme that does not build fails
      # here; its unit tests ran in `npm test` above.
      - name: build the sign-in theme
        run: node identity-theme/build.mjs "$RUNNER_TEMP/identity-theme"
