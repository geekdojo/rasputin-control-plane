name: sast

# Static analysis of code WE wrote — gosec + staticcheck over the Go
# workspace modules (api / agent / proto). The companion to vuln-scan.yml,
# which answers a different question: govulncheck finds known advisories in
# our DEPENDENCIES, and until this landed nothing looked at our own code for
# a hardcoded credential, a path traversal, or weak crypto.
#
# Policy lives in scripts/sast-scan.sh, not here, exactly as vuln-scan.yml
# defers to scripts/vuln-scan.sh. In short: staticcheck is gated CLEAN,
# gosec is gated against .github/gosec-baseline.txt and fails only on NEW
# findings. No HIGH finding is allowed in that baseline — HIGHs are fixed or
# annotated `#nosec Gxxx -- reason` at the source.
#
# Tool versions are pinned INSIDE the script and installed through its
# --install mode rather than being repeated here, so the pin the gate runs
# with and the pin CI installs cannot drift apart.
#
# Deliberately NOT on a schedule, unlike vuln-scan.yml. That schedule earns
# its keep because advisories are published against code that is sitting
# still; here both tools are pinned to exact versions, so a scheduled run
# analyses the same code with the same rules and can only ever repeat the
# last answer. New rules arrive when someone bumps the pin in the script.
#
# Conventions match ci.yml: Go 1.26, actions/setup-go@v5 cached on the
# workspace's go.sum files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # GOTOOLCHAIN: the go command fetches this toolchain itself, from the module
  # proxy, instead of using whatever actions/setup-go could resolve. That matters
  # because setup-go resolves against GitHub's actions/go-versions manifest, which
  # LAGS go.dev — on 2026-08-13 go1.26.6 was published and fixed five reachable
  # net/http + encoding/asn1 advisories, but the manifest still topped out at
  # 1.26.5, so neither `go-version: "1.26"` nor check-latest could obtain the fix
  # and vuln-scan was red on code that had passed hours earlier.
  #
  # Bumping this one line is the whole remediation for a stdlib advisory, and it
  # WORKS the day the fix ships rather than whenever GitHub catches up. Kept as an
  # exact version deliberately: `latest` would also jump minor releases and break
  # the build on Go's schedule rather than ours.
  GOTOOLCHAIN: go1.26.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sast:
    name: gosec + staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # check-latest: fetch the newest 1.26.x rather than reusing whatever
          # patch the runner image happens to have cached — same reasoning as
          # ci.yml and vuln-scan.yml.
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: |
            api/go.sum
            agent/go.sum

      # Both tools install into GOPATH/bin, which is not on PATH by default
      # for subsequent steps.
      - name: install pinned tools
        run: |
          ./scripts/sast-scan.sh --install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: scan
        run: ./scripts/sast-scan.sh
