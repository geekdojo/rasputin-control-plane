name: mutation-gate

# Diff-scoped mutation testing on every PR — step 3 of the scheduled
# quality agents from the July 2026 "AI Agents for Continuous Quality"
# research note (geekdojo-brain projects/rasputin/research/). Mutation
# testing measures whether the tests CATCH FAULTS, not merely whether they
# execute lines — the "no line-coverage ratchet" finding from the note.
#
# Tool: gremlins v0.6.0 (go-gremlins/gremlins). Its --diff mode mutates
# ONLY the code a PR changes vs the base branch, so a run is tens of
# mutants (a few minutes) instead of the ~2600 repo-wide mutants that make
# full-module mutation infeasible per-PR. A PR that changes no Go code
# short-circuits in under a second.
#
# PHASE: ADVISORY (calibration). This job posts the mutation result as a PR
# comment and ALWAYS succeeds — it does not block merges yet. Once we've
# seen what real PRs score, flip it to blocking (see "TO MAKE BLOCKING"
# below) and add it to branch-protection required checks.
#
#   WHAT IT WILL ASSERT (decided on #59): a NO-REGRESSION RATCHET — efficacy on
#   the PR's changed code must not fall below main's. It catches test rot, needs
#   no arbitrary magic threshold, and never blocks on a line nobody should test.
#   NOT a fixed efficacy floor (the number would be arbitrary and need tuning).
#   The per-survivor "review each one" judgement call is demoted to advisory
#   context (the comment below), never a merge precondition. Stays advisory until
#   the ratchet is proven on real PRs.
#
#   TO MAKE BLOCKING (later):
#     1. Compute main's efficacy on the same changed files and fail when the
#        PR's efficacy regresses below it (the ratchet above). A fixed
#        --threshold-efficacy is the cruder fallback, not the plan.
#     2. Remove the "|| true" advisory guard on the gremlins invocation and
#        drop MUTATION_ADVISORY handling so a regressing run fails.
#     3. Add "mutation-gate" to the repo's required status checks.
#
#   PRECONDITION: the NOT COVERED cross-check below (scripts/
#   mutation-notcovered-classify.sh) must stay in place — the ratchet is only
#   trustworthy once the labels it reports are.
#
# No secrets: gremlins needs none. Same-repo PRs only, because the advisory
# comment needs pull-requests: write (fork PRs get a read-only token).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mutation-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # GOTOOLCHAIN: the go command fetches this toolchain itself, from the module
  # proxy, instead of using whatever actions/setup-go could resolve. That matters
  # because setup-go resolves against GitHub's actions/go-versions manifest, which
  # LAGS go.dev — on 2026-08-13 go1.26.6 was published and fixed five reachable
  # net/http + encoding/asn1 advisories, but the manifest still topped out at
  # 1.26.5, so neither `go-version: "1.26"` nor check-latest could obtain the fix
  # and vuln-scan was red on code that had passed hours earlier.
  #
  # Bumping this one line is the whole remediation for a stdlib advisory, and it
  # WORKS the day the fix ships rather than whenever GitHub catches up. Kept as an
  # exact version deliberately: `latest` would also jump minor releases and break
  # the build on Go's schedule rather than ours.
  GOTOOLCHAIN: go1.26.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GREMLINS_VERSION: v0.6.0

jobs:
  mutation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 so gremlins can diff the PR head against the base
      # branch (origin/<base>). Required by gremlins --diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # check-latest: fetch the newest 1.26.x rather than reusing whatever
          # patch the runner image happens to have cached. On 2026-08-13 the
          # runner served a cached go1.26.5 while go1.26.6 — which fixes five
          # reachable net/http + encoding/asn1 advisories — was already
          # published, so vuln-scan went red on a commit whose identical code
          # had passed an hour earlier and no re-run could clear it.
          go-version: "1.26"
          check-latest: true
          # Glob, not a literal list: every go.work module's go.sum keys the
          # cache, so adding a module cannot silently leave it out.
          cache-dependency-path: "*/go.sum"

      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${{ env.GREMLINS_VERSION }}

      - name: mutation test (diff-scoped, advisory)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # MONOREPO PATH FIX (load-bearing): gremlins computes its diff with
          # `git diff --merge-base <ref>` and matches the result against
          # module-relative mutant paths (internal/...). But git, run from a
          # module subdir, prints REPO-relative paths (api/internal/...) by
          # default, so nothing matches and every mutant is silently SKIPPED —
          # the gate would report "no Go changes" on every PR. Setting
          # diff.relative makes git emit paths relative to the CWD (the module
          # dir), which is exactly what gremlins expects. Verified: without
          # this, a known-covered change reports 0 mutants run; with it, the
          # mutant is found and KILLED.
          git config diff.relative true

          # gremlins runs per Go module, and this list is a DELIBERATE SUBSET
          # of go.work — the one module list in this repo that is not derived
          # from scripts/workspace-modules.sh, and must not be "fixed" to be.
          # Mutation testing costs minutes of PR time per module actually
          # touched, so which modules to buy is a judgement call, not a
          # coverage gap.
          #
          # It used to say `api agent`, justified as "the two modules with
          # tests; proto/ is generated". That justification went stale:
          # proto/, artifactsig/ and tileschema/ all have tests today, and
          # proto/ is hand-written, not generated.
          #
          # artifactsig/ joins because it is the code that decides whether a
          # downloaded OS or firmware image is authentic — a surviving mutant
          # there is a test suite that would not notice signature verification
          # being weakened. It is also the cheapest module in the workspace to
          # mutate. Measured on a full unleash (worst case; the diff scoping
          # below means a whole-module scan only happens when that module
          # changes):
          #
          #   artifactsig   24 mutants,  10s, efficacy 100.00%, coverage 100.00%
          #   proto         66 mutants,  16s, efficacy  88.89%, coverage  60.00%
          #   tileschema   117 mutants,  43s, efficacy  92.31%, coverage  88.89%
          #
          # proto/ and tileschema/ are affordable and would land with real
          # survivors to triage on their first touching PR; adding them is a
          # separate decision, not an oversight.
          #
          # A module with no in-diff Go changes short-circuits ~instantly.
          modules="api agent artifactsig"

          summary=""      # per-module one-liners for the comment/summary
          survivors=""    # real survivors: LIVED + genuinely-not-covered lines
          artifacts=""    # NOT COVERED lines that are actually on covered code
          total=0         # total mutants actually run (killed+lived+notcov)

          for m in $modules; do
            # EMPTY-DIFF GUARD (load-bearing): gremlins treats an empty diff as
            # "everything changed" and mutates the WHOLE module — so a PR that
            # touches only one module would trigger a full (minutes-long,
            # hundreds-of-mutants) scan of every other module and flood the
            # comment. Only invoke gremlins when THIS module actually has
            # changed .go files vs the base. (--relative scopes the path list
            # to the module dir, matching gremlins' own path handling.)
            changed=$(cd "$m" && git diff --name-only --relative "origin/$BASE" -- '*.go')
            if [ -z "$changed" ]; then
              summary="${summary}- **${m}** — no changed Go code"$'\n'
              continue
            fi

            echo "::group::gremlins $m"
            # -S lc  -> stdout shows only LIVED and NOT COVERED mutants
            # || true -> ADVISORY: a below-threshold/any exit never fails CI
            out=$(cd "$m" && gremlins unleash --diff "origin/$BASE" -S lc \
                    -E '\.pb\.go$' -E '_gen\.go$' 2>&1 || true)
            echo "$out"
            echo "::endgroup::"

            killed=$(echo "$out"   | sed -n 's/^Killed: \([0-9]*\).*/\1/p'      | tail -1)
            lived=$(echo "$out"    | sed -n 's/.*Lived: \([0-9]*\).*/\1/p'      | tail -1)
            notcov=$(echo "$out"   | sed -n 's/.*Not covered: \([0-9]*\).*/\1/p' | tail -1)
            eff=$(echo "$out"      | sed -n 's/^Test efficacy: \(.*\)$/\1/p'    | tail -1)
            mcov=$(echo "$out"     | sed -n 's/^Mutator coverage: \(.*\)$/\1/p' | tail -1)
            : "${killed:=0}"; : "${lived:=0}"; : "${notcov:=0}"

            run=$((killed + lived + notcov))
            total=$((total + run))
            if [ "$run" -eq 0 ]; then
              summary="${summary}- **${m}** — no changed Go code"$'\n'
            else
              # Split gremlins' surviving-mutant lines by verdict.
              lived_raw=$(echo "$out"  | grep -E '^\s*LIVED' || true)
              notcov_raw=$(echo "$out" | grep -E '^\s*NOT COVERED' || true)

              # NOT-COVERED CROSS-CHECK (#59): gremlins mislabels any mutant
              # inside a `switch { case <expr>: }` as NOT COVERED, because Go
              # opens the coverage block at the case *body* column, not the case
              # *expression* column where the mutant sits — so it's published
              # under "a fault the tests did not catch" when the line is in fact
              # executed and the mutant killed. Re-check each NOT COVERED mutant
              # against a real coverage profile: REAL = a genuine gap, ARTIFACT =
              # a covered line that gremlins mislabeled.
              real_notcov=""
              art_notcov=""
              nart=0
              if [ -n "$notcov_raw" ]; then
                classified=$(echo "$notcov_raw" | ./scripts/mutation-notcovered-classify.sh "$m")
                real_notcov=$(echo "$classified" | sed -n 's/^REAL'$'\t''//p')
                art_notcov=$(echo "$classified"  | sed -n 's/^ARTIFACT'$'\t''//p')
                [ -n "$art_notcov" ] && nart=$(echo "$art_notcov" | grep -c . || true)
              fi

              # Per-module summary — flag mislabeled not-covered so the number
              # can't be misread as "N faults your tests miss".
              notcov_disp="$notcov"
              [ "$nart" -gt 0 ] && notcov_disp="${notcov} (${nart} on covered lines — see note)"
              summary="${summary}- **${m}** — efficacy ${eff:-n/a} · coverage ${mcov:-n/a} · killed ${killed} / lived ${lived} / not-covered ${notcov_disp}"$'\n'

              # Real survivors (LIVED + genuinely-not-covered), module-qualified.
              real_surv=$(printf '%s\n' "$lived_raw" "$real_notcov" | grep -E '^\s*(LIVED|NOT COVERED)' | sed "s#at #at ${m}/#" || true)
              [ -n "$real_surv" ] && survivors="${survivors}${real_surv}"$'\n'
              # Mislabeled not-covered, module-qualified, reported separately.
              if [ -n "$art_notcov" ]; then
                artifacts="${artifacts}$(echo "$art_notcov" | sed "s#at #at ${m}/#")"$'\n'
              fi
            fi
          done

          # Build the report body.
          {
            echo "## Mutation gate (advisory)"
            echo "<!-- mutation-gate-marker -->"
            echo
            echo "Diff-scoped mutation testing on this PR's changed Go code — gremlins \`${GREMLINS_VERSION}\`, \`--diff origin/${BASE}\`. **Advisory during calibration: this does not block merge.**"
            echo
            echo "$summary"
            if [ -n "$survivors" ]; then
              echo "Surviving mutants — either a change the tests still passed on (\`LIVED\`) or a line no test executes (\`NOT COVERED\`). Consider adding a case that fails when this line is mutated:"
              echo
              echo '```'
              echo "$survivors"
              echo '```'
            elif [ "$total" -gt 0 ]; then
              echo "✅ No surviving mutants the tests should catch in the changed code."
            fi
            if [ -n "$artifacts" ]; then
              echo
              echo "> **These \`NOT COVERED\` labels are false positives — the line *is* covered.** gremlins looks up coverage at the mutant's exact column, but Go opens the coverage block for a \`switch { case <expr>: }\` at the case *body* column, not the case *expression* column. No test is needed for these. ([#59](https://github.com/${GITHUB_REPOSITORY}/issues/59))"
              echo
              echo '```'
              echo "$artifacts"
              echo '```'
            fi
            echo
            echo "<sub>Mutation testing checks whether tests *catch* faults, not just *execute* lines. LIVED = a code change the tests still passed on. Once calibrated, this becomes a required check.</sub>"
          } > /tmp/mutation-report.md

          cat /tmp/mutation-report.md >> "$GITHUB_STEP_SUMMARY"

          # Only comment when there was Go code to mutate — no noise on
          # docs/ui-only PRs. Update our previous comment in place if present.
          if [ "$total" -gt 0 ]; then
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                        --jq '[.[] | select(.body | contains("mutation-gate-marker"))][0].id' 2>/dev/null || true)
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                -f body="$(cat /tmp/mutation-report.md)" >/dev/null
            else
              gh pr comment "$PR" --body-file /tmp/mutation-report.md
            fi
          else
            echo "No changed Go code to mutate; skipping PR comment."
          fi
