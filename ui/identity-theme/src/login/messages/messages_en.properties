# The Rasputin login theme's English messages, over base's (geekdojo/geekdojo-brain#988, ui.md §4.4).
# Every value is a sentence a person reads: no engine name and no authenticator brand
# (ui/forbidden-words.json), and each error says what happened and what to do (ERR-MESSAGE).
# Keycloak formats each value with java.text.MessageFormat, so an apostrophe is written ''.
# Base keys left to base are listed, with the reason each is never shown, in ../../../coverage.json.

