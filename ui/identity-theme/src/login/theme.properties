# The Rasputin login theme (geekdojo/geekdojo-brain#988, ui.md §4.1). parent=base,
# not keycloak.v2, so a page we missed shows our classes, never PatternFly.
# Every kc*Class hook base's templates or ours read is mapped here; the
# coverage test (ui/identity-theme/test) fails on one that is not.
parent=base
import=common/keycloak
locales=en

styles=css/tokens.css css/components.css css/signin.css
stylesCommon=
meta=viewport==width=device-width,initial-scale=1

## The frame
kcHtmlClass=rasp-signin
kcBodyClass=rasp-body
kcLoginClass=rasp-shell
kcHeaderClass=rasp-brand
kcHeaderWrapperClass=rasp-brand-name
kcFormCardClass=rasp-card
kcFormHeaderClass=rasp-card-header
kcContentWrapperClass=rasp-row
kcSignUpClass=rasp-info
kcInfoAreaWrapperClass=rasp-info-wrap
kcMarginTopClass=rasp-mt

## Locale (internationalization is off; never shown)
kcLocaleMainClass=rasp-hidden
kcLocaleWrapperClass=rasp-hidden
kcLocaleDropDownClass=rasp-hidden
kcLocaleListClass=rasp-hidden
kcLocaleListItemClass=rasp-hidden
kcLocaleItemClass=rasp-hidden

