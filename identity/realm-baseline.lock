# realm-baseline.lock — the drift lock for realm-baseline.json
# (geekdojo/geekdojo-brain#980; platform.md §4.2). scripts/pack-identity.sh
# checks it on every pack, so CI and the release build fail when the baseline
# and this file disagree, and it refuses a missing or malformed lock.
#
# The baseline is frozen from the arming release: an edited baseline would give
# fresh installs one realm by import and upgraded clusters another by
# migration.
#
#   armed-at=none   Not armed yet. An edit to realm-baseline.json fails until
#                   the same change records its new sha256 below.
#   armed-at=<tag>  Frozen at <tag>. An edit fails, and this is not a hash to
#                   re-bless: restore the file and change the realm through a
#                   migration (Identity 3.5). Never edit this lock.
#
# Owner of the flip: a step in the release skill (geekdojo-brain), at the first
# stable release that runs identity.arm, after Identity 3.5's CI import of the
# baseline. That one change sets armed-at to that release's tag and keeps the
# sha256 as it is.
armed-at=none
sha256=63e70ceedc3cd496f29f3b54c3787a1efba01706790f32804ad9a9d2c4046470
