# TestPostgresTLSOnly's server (geekdojo/geekdojo-brain#972): #958's TLS lines
# (identity-evidence/958/conf/postgresql.conf), the shape capability rows T69
# and T70 rely on. The key, certificate and CA are where LoadCredential= puts
# them; start.sh stands in for it.
listen_addresses='127.0.0.1'
port=5432
unix_socket_directories=''
ssl=on
ssl_min_protocol_version='TLSv1.3'
ssl_cert_file='/run/credentials/keycloak-db.service/server.pem'
ssl_key_file='/run/credentials/keycloak-db.service/server.key'
ssl_ca_file='/run/credentials/keycloak-db.service/identity-ca.pem'
hba_file='/etc/rasputin/identity/pg_hba.conf'
log_destination='stderr'
